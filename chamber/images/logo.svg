<svg xmlns="http://www.w3.org/2000/svg" width="911" height="520" viewBox="0 0 911 520">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f4f4"/>
      <stop offset="50%" stop-color="#cfcfcf"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="0" y="0" width="911" height="520" rx="6" fill="url(#frame)"/>

  <!-- Inner white border -->
  <rect x="12" y="12" width="887" height="496" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>

  <!-- Embedded image -->
  <image href="image(25).png" x="20" y="20" width="871" height="480" preserveAspectRatio="xMidYMid slice"/>

  <!-- Blue banner -->
  <rect x="77" y="206" width="751" height="64"
        fill="#3f6fc6" fill-opacity="0.88"
        stroke="#274b8f" stroke-width="2"/>

  <!-- Text -->
  <text x="95" y="246"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        fill="#ffffff">
    Asaba Chamber of Commerce, Industry, Mines and Agriculture
  </text>
</svg>